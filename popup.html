<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title id="app-title">Gemini Enter Key Control</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 220px;
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
      max-height: 580px;
      overflow-y: auto;
    }

    .section {
      margin-bottom: 12px;
    }

    .title {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .support-note {
      margin-top: 8px;
      font-size: 11px;
      line-height: 1.35;
      color: #666;
    }

    .google-ai-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 20px;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .service-toggle { margin: 0; justify-self: center; }
    #flow-access[hidden] { display: none; }
    #flow-access { margin: 4px 0 10px; }
    #flow-access-button { margin-top: 4px; font-size: 11px; cursor: pointer; }

    #google-ai-mode-toggle { margin: 0; justify-self: center; }
    #service-access-note { white-space: pre-line; overflow-wrap: anywhere; margin-top: 0; line-height: 1.5; }
    #google-ai-mode-status:empty { display: none; }

    .flow-shortcut-notice {
      margin-top: 8px;
      padding: 7px 8px;
      border-left: 3px solid #8a8a8a;
      background: #f5f5f5;
      color: #555;
      font-size: 11px;
      line-height: 1.4;
    }

    .flow-shortcut-notice[hidden] {
      display: none;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    hr {
      border: none;
      border-top: 1px solid #ddd;
      margin: 12px 0;
    }

    .secondary-toggle-wrap {
      text-align: center;
      margin-top: -3px;
      margin-bottom: 0;
      line-height: 1;
    }

    .secondary-toggle-wrap.hidden {
      display: none;
    }

    .secondary-toggle {
      border: none;
      background: none;
      color: #666;
      cursor: pointer;
      font-size: 11px;
      padding: 1px 6px;
      line-height: 1;
    }

    .secondary-content {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.18s ease, opacity 0.18s ease, margin-top 0.18s ease;
      margin-top: 0;
    }

    .secondary-content.open {
      max-height: none;
      opacity: 1;
      margin-top: 8px;
    }

    .language-setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: #444;
      margin-top: 2px;
    }

    .language-setting-label {
      min-width: 0;
      white-space: nowrap;
    }

    .language-select {
      flex-shrink: 0;
      font-size: 11px;
      color: #444;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 4px;
      padding: 1px 4px;
      min-width: 70px;
    }

    .other-extensions {
      display: block;
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 12px;
      color: #1a73e8;
      text-decoration: none;
    }

    .other-extensions:hover {
      color: #1558b0;
      text-decoration: underline;
    }

    .version-row {
      margin-left: auto;
      white-space: nowrap;
      font-size: 12px;
      color: #444;
      line-height: 1.4;
    }

    .popup-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="section title" id="app-header">Gemini Enter Key Control</div>

  <div class="section">
    <label>
      <input type="checkbox" id="toggle">
      <span id="label-enable-enter-control"></span>
    </label>
  </div>

  <hr>

  <div class="section">
    <div class="title" id="title-send-key"></div>
    <div id="mode-options"></div>
    <div class="flow-shortcut-notice" id="flow-shortcut-notice" data-i18n="flowShortcutNotice" hidden></div>
  </div>

  <hr>

  <div class="secondary-toggle-wrap" id="secondary-toggle-wrap">
    <button id="secondary-toggle" class="secondary-toggle" type="button" aria-expanded="false"><span data-i18n="detailsLabel"></span> <span aria-hidden="true">▼</span></button>
  </div>

  <div class="secondary-content" id="secondary-content">
    <div class="section">
      <div class="title" data-i18n="servicesTitle"></div>
      <div class="google-ai-row"><span id="gemini-service-title">Gemini</span><input class="service-toggle" type="checkbox" id="gemini-service-toggle" aria-labelledby="gemini-service-title" disabled></div>
      <div class="google-ai-row"><span id="notebook-service-title">Gemini Notebook</span><input class="service-toggle" type="checkbox" id="notebook-service-toggle" aria-labelledby="notebook-service-title" disabled></div>
      <div class="google-ai-row"><span id="chat-service-title">Google Chat</span><input class="service-toggle" type="checkbox" id="chat-service-toggle" aria-labelledby="chat-service-title" disabled></div>
      <div class="google-ai-row"><span id="flow-service-title">Google Flow</span><input class="service-toggle" type="checkbox" id="flow-service-toggle" aria-labelledby="flow-service-title" disabled></div>
      <div id="flow-access" class="support-note" hidden>
        <div data-i18n="flowAccessNote"></div>
        <button id="flow-access-button" type="button" data-i18n="flowAccessEnable"></button>
      </div>
      <div id="service-status" class="support-note" role="status" aria-live="polite"></div>
      <div class="google-ai-row">
        <span id="google-ai-mode-title" data-i18n="googleAiServiceName"></span>
        <input type="checkbox" id="google-ai-mode-toggle" disabled aria-labelledby="google-ai-mode-title" aria-describedby="service-access-note">
      </div>
      <div class="support-note" id="google-ai-mode-status" role="status" aria-live="polite"></div>
    </div>

    <div class="section">
      <div class="support-note" id="service-access-note" data-i18n="serviceAccessNote"></div>
    </div>

    <div class="language-setting-row">
      <span class="language-setting-label" id="language-setting-label"></span>
      <select id="language-select" class="language-select" aria-label="Language setting">
        <option value="auto">Auto</option>
        <option value="en">EN</option>
        <option value="ja">JA</option>
        <option value="ko">KO</option>
        <option value="zh_CN">ZH-CN</option>
        <option value="zh_TW">ZH-TW</option>
        <option value="es">ES</option>
        <option value="pt_BR">PT-BR</option>
      </select>
    </div>

    <div class="popup-footer">
      <a class="other-extensions" id="other-extensions-link" href="#"></a>
      <div class="version-row" id="app-version">v</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
